[package]
name = "karembo-backend"
version = "0.1.0"
edition = "2024"

[dependencies]
actix-web = "4.15.0"
actix-cors = "0.7.2"
argon2 = "0.6.0"
chrono = { version = "0.4.45", features = ["serde"] }
dotenvy = "0.15.7"
env_logger = "0.11.11"
# jsonwebtoken 11 ships no crypto provider in its default features and panics at
# the first sign/verify if none is selected. `rust_crypto` is pure Rust, so it
# needs no C toolchain. `use_pem` is dropped because HS256 uses a raw secret
# rather than PEM-encoded keys.
jsonwebtoken = { version = "11.0.0", default-features = false, features = ["rust_crypto"] }
log = "0.4"
rand = "0.9"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
sqlx = { version = "0.9.0", default-features = false, features = [
    "runtime-tokio",
    "tls-rustls",
    "postgres",
    "macros",
    "migrate",
    "chrono",
    "uuid",
] }
thiserror = "2.0.20"
tokio = { version = "1", features = ["full"] }
uuid = { version = "1.26.0", features = ["serde", "v4"] }
